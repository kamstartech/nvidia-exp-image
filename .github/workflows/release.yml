name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

env:
    REGISTRY_USER: ${{ github.actor }}
    REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

jobs:
  verify-image:
    runs-on: ubuntu-latest

    steps:
    - name: Verify Base Image Integrity
      run: |
        gh attestation verify oci://ghcr.io/vanilla-os/desktop:main --owner Vanilla-OS
      env:
        GH_TOKEN: ${{ github.token }}

  release:
    runs-on: ubuntu-latest
    needs: verify-image
    permissions:
      contents: write # Allow actions to create release
      attestations: write # To create and write attestations
      id-token: write # Additional permissions for the persistence of the attestations
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest release version
        id: get_version
        run: |
          latest_version=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          if [ -z "$latest_version" ]; then
            echo "v1.2" > version.txt
          else
            version_number=$(echo $latest_version | sed 's/v//')
            new_version=$(echo $version_number | awk -F. -v OFS=. '{$NF++;print}')
            echo "v$new_version" > version.txt
          fi

      - name: Set version
        id: set_version
        run: echo "RELEASE_VERSION=$(cat version.txt)" >> $GITHUB_ENV

      - name: Change tag in recipe
        run: |
          sed 's/ghcr.io\/vanilla-os\/desktop:dev/ghcr.io\/vanilla-os\/desktop:main/' -i recipe.yml

      - uses: vanilla-os/vib-gh-action@v0.7.4
        with:
            recipe: 'recipe.yml'
            plugins: 'Vanilla-OS/vib-fsguard:v1.5.3'

      - uses: actions/upload-artifact@v4
        with:
            name: Containerfile
            path: Containerfile

      - name: Create or Update Release
        id: create_release
        run: |
            release_id=$(gh release view "${{ env.RELEASE_VERSION }}" --json id --jq '.id' || echo "")
            if [ -z "$release_id" ]; then
              gh release create "${{ env.RELEASE_VERSION }}" --generate-notes Containerfile
            else
              gh release upload "${{ env.RELEASE_VERSION }}" Containerfile --clobber
            fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest Release Files
        id: attest
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'Containerfile'
