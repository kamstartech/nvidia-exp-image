name: Vanilla Desktop Nvidia Experimental
id: nvidia-exp
stages:
  - id: build
    base: ghcr.io/vanilla-os/desktop:main
    singlelayer: false
    labels:
      maintainer: Vanilla OS Contributors
    args:
      DEBIAN_FRONTEND: noninteractive
    runs:
      commands:
        - echo 'APT::Install-Recommends "1";' > /etc/apt/apt.conf.d/01norecommends

    modules:
      - name: init-setup
        type: shell
        commands:
          - lpkg --unlock
          - apt-get update
          - apt-get upgrade -y
          - apt-get autoremove -y
          - apt-get install -y usrmerge

      - name: nvidia-official-repo
        type: shell
        commands:
          - curl -fSsL https://developer.download.nvidia.com/compute/cuda/repos/debian12/x86_64/3bf863cc.pub | gpg --dearmor -o /usr/share/keyrings/nvidia-drivers.gpg
          - echo 'deb [signed-by=/usr/share/keyrings/nvidia-drivers.gpg] https://developer.download.nvidia.com/compute/cuda/repos/debian12/x86_64/ /' > /etc/apt/sources.list.d/nvidia-drivers.list
          - apt-get update

      - name: nvidia-official-driver
        type: shell
        commands:
          - apt-mark hold nvidia-kernel-open nvidia-driver nvidia-vaapi-driver nvidia-settings nvidia-persistenced libnvidia-cfg1 libnvidia-glcore libnvidia-glvkspirv libnvidia-gpucomp libnvidia-fbc1 nvidia-container-toolkit
        modules:
          - name: install-nvidia
            type: apt
            source:
              packages:
                - nvidia-kernel-open
                - nvidia-driver
                - nvidia-vaapi-driver
                - nvidia-settings
                - nvidia-persistenced
                - cuda-drivers
                - libnvidia-cfg1
                - libnvidia-glcore
                - libnvidia-glvkspirv
                - libnvidia-gpucomp
                - libnvidia-fbc1
                - nvidia-container-toolkit

      - name: nvidia-sysd-units
        type: shell
        commands:
          - mkdir -p /etc/systemd/system/systemd-suspend.service.wants
          - mkdir -p /etc/systemd/system/systemd-hibernate.service.wants
          - ln -s /usr/lib/systemd/system/nvidia-suspend.service /etc/systemd/system/systemd-suspend.service.wants/nvidia-suspend.service
          - ln -s /usr/lib/systemd/system/nvidia-hibernate.service /etc/systemd/system/systemd-hibernate.service.wants/nvidia-hibernate.service
          - ln -s /usr/lib/systemd/system/nvidia-resume.service /etc/systemd/system/systemd-hibernate.service.wants/nvidia-resume.service

      - name: install-docker
        type: shell
        commands:
          - install -m 0755 -d /etc/apt/keyrings
          - curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          - chmod a+r /etc/apt/keyrings/docker.asc
          - ls  /etc/apt/sources.list.d
          - echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable" > /etc/apt/sources.list.d/docker.list 
          - cat /etc/apt/sources.list.d/docker.list
          - apt-get update
          - apt-get install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin -y

      - name: get-curl
        type: shell
        commands:
          - apt-get update
        modules:
          - name: install-curl-ca-certificate
            type: apt
            source:
              packages:
                - ca-certificates
                - curl
                - cpu-checker
                - virt-manager
                - libvirt-daemon-system 
                - libvirt-clients 
                - bridge-utils
                - adduser
                
      - name: adding-libvirt-user
        type: shell
        commands:
          - id -u libvirt-qemu &>/dev/null || useradd libvirt-qemu && getent group libvirt-qemu &>/dev/null || groupadd libvirt-qemu && getent group libvirt &>/dev/null || groupadd libvirt  && getent group libvirtd &>/dev/null || groupadd libvirtd  && usermod -aG libvirt-qemu libvirt-qemu
          - systemctl enable libvirtd
                    
      - name: extra-utilities
        type: apt
        source:
          packages:
            - switcheroo-control

      - name: vanilla-tools
        type: shell
        source:
          type: tar
          url: https://github.com/Vanilla-OS/vanilla-tools/releases/download/v1.0.0/vanilla-tools.tar.gz
          checksum: 0e1d92d9c9154f9a115e97b40ff692afa52ddd0d9f770a8ec67440bf1a48aa72
        commands:
          - mkdir -p /usr/bin
          - cp /sources/vanilla-tools/vanilla-tools/nrun /usr/bin/nrun
          - cp /sources/vanilla-tools/vanilla-tools/prime-switch /usr/bin/prime-switch
          - chmod +x /usr/bin/nrun
          - chmod +x /usr/bin/prime-switch

      - name: enable-wayland
        type: shell
        commands:
          - mkdir -p /etc/udev/rules.d
          - ln -s /dev/null /etc/udev/rules.d/61-gdm.rules

      - name: cleanup
        type: shell
        commands:
          - apt update
          - apt upgrade -y
          - apt autoremove -y
          - apt clean
          - apt remove -y zutty gnome-shell-extension-prefs
          - SUDO_FORCE_REMOVE=yes apt purge -y sudo
          - lpkg --lock

      - name: fsguard
        type: fsguard
        CustomFsGuard: false
        FsGuardLocation: "/usr/sbin/FsGuard"
        GenerateKey: true
        FilelistPaths: ["/usr/bin"]
        modules:
          - name: remove-prev-fsguard
            type: shell
            commands:
              - rm -rf /FsGuard
              - rm -f ./minisign.pub ./minisign.key
              - chmod +x /usr/sbin/init

      - name: cleanup2
        type: shell
        commands:
          - rm -rf /tmp/*
          - rm -rf /var/tmp/*
          - rm -rf /sources
